name: Pages

# Publishes the exported site to GitHub Pages at workly-reel.maecly.com.
#
# Only from `main`, and only after Verify has agreed with it. A deploy is the
# one action here that a reader can see, so it does not run on a pull request
# and it does not run on a branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The token is scoped to what a deploy needs and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is already publishing: a
# half-written site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The design system is a private repository consumed as a pinned git
      # dependency, so the build cannot resolve it without a key. Unlike the
      # Verify workflow, this job has no useful degraded mode: a site built
      # without the design system would publish unstyled. So it fails loudly.
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WORKLY_REEL_UI_DEPLOY_KEY }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `next build` and then hoists the security policy to
      # the front of every exported document. Publishing the output of a bare
      # `next build` would publish a policy that governs nothing.
      - name: Export
        run: pnpm build

      # THE REDACTION GATE, on the one path where the bytes actually become
      # public. Everything below this line hands `out/` to Pages, and Pages
      # serves all of it: a file nothing links to is published as completely as
      # the home page, and no browser and no reviewer would ever open it. So the
      # last thing that happens before the artefact is built is that every byte
      # of it is read and refused a source map, an identity, a credential,
      # identifying image metadata, and a file nobody meant to publish.
      #
      # It has no `if:` and it never will. `pnpm build` above runs the same
      # check, which is what makes it impossible to produce `out/` without it
      # passing, and this step is here so the deploy asks again in its own
      # right: a gate that only ever ran as a side effect of another script is
      # one edit away from not running at all, and this is the run where that
      # would matter most, because nobody is watching a push to main the way
      # they watch a pull request.
      #
      # A finding names the kind, the file and the position and never the value.
      # This log is public the moment the repository is.
      - name: Export privacy
        run: pnpm privacy:check

      # The published bytes are the tested bytes: this is the same check the
      # verify chain runs, against the same `out/`.
      - name: Smoke
        run: pnpm smoke

      # The custom domain lives in the repository's Pages settings, not in the
      # artefact. This step used to assert `out/CNAME` existed and described that
      # file as what keeps the domain; measured against a real deploy, that is
      # false. The artefact carried the file, the log said "Publishing to
      # workly-reel.maecly.com", and the configured domain stayed empty until it
      # was set through the API. A branch-published site reads that file; an
      # Actions-published one ignores it.
      #
      # So the check now reads the setting that actually governs. If the domain
      # is cleared or changed, the site silently moves to the github.io address
      # where every root-absolute asset path 404s - the page still renders, with
      # no styling, which is a failure that looks like a design regression.
      - name: Confirm the published domain is the intended one
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: workly-reel.maecly.com
        run: |
          configured="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""' 2>/dev/null || echo "")"
          if [ "$configured" != "$EXPECTED" ]; then
            echo "::error::Pages is configured for '${configured:-<none>}' but this site is built for ${EXPECTED}. Every asset path is absolute from the root, so publishing under any other address serves an unstyled page."
            exit 1
          fi
          echo "Publishing to $configured"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
